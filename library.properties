sentence=VGA 640x480@60 from an ESP32-S3, through the LCD_CAM parallel peripheral and a 16-bit R2R ladder.
paragraph=Two modes: 320x240 in full colour for photos and animation, and 640x480 in 16 colours for crisp text and charts - 80x30 characters, the classic DOS text mode geometry. Drawing comes from Lonely Binary GFX, so the same calls work on a TFT and on e-paper and a function can take a display of any kind. The framebuffer is pinned to internal SRAM, which leaves the whole PSRAM free for your own use. Brought to you by Lonely Binary - thank you for supporting our open-source work!
category=Display
