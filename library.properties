sentence=VGA 640x480@60 output for the ESP32-S3 through the LCD_CAM parallel peripheral and a 16-bit R2R ladder.
paragraph=Two modes: 320x240 full colour for photos and animation, and 640x480 in 16 colours for crisp text and charts. The drawing surface is a LovyanGFX LGFX_Sprite, so fonts, JPEG/PNG decoding and anti-aliased shapes all work. The framebuffer is pinned to internal SRAM, which leaves the whole PSRAM free for your own use.
